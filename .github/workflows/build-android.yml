      - name: Patch Android Gradle for FCM, Java 21 and signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          # Force Gradle itself to run with the same JDK 21 configured by setup-java.
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "❌ JAVA_HOME is not set"
            exit 1
          fi
          touch android/gradle.properties
          { grep -v \
              -e '^org.gradle.java.home=' \
              -e '^android.enableR8.fullMode=' \
              -e '^android.enableResourceOptimizations=' \
              -e '^android.nonTransitiveRClass=' \
              -e '^android.enableAppCompileTimeRClass=' \
              android/gradle.properties || true; } > /tmp/gradle.properties.tmp
          mv /tmp/gradle.properties.tmp android/gradle.properties
          printf '\norg.gradle.java.home=%s\n' "$JAVA_HOME" >> android/gradle.properties
          # R8 full mode + otimização/redução agressiva de recursos.
          # Recomendação Play #4: "A redução otimizada de recursos não está ativada".
          printf 'android.enableR8.fullMode=true\n' >> android/gradle.properties
          printf 'android.enableResourceOptimizations=true\n' >> android/gradle.properties
          printf 'android.nonTransitiveRClass=true\n' >> android/gradle.properties
          printf 'android.enableAppCompileTimeRClass=true\n' >> android/gradle.properties



          # Root Gradle: keep google-services classpath available for FCM.
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "/classpath 'com.android.tools.build:gradle/a\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          fi
          # Root Gradle: Firebase Crashlytics gradle plugin (needed for NDK symbol upload).
          if ! grep -q "firebase-crashlytics-gradle" android/build.gradle; then
            sed -i "/classpath 'com.google.gms:google-services/a\        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'" android/build.gradle
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path('android/app/build.gradle')
          s = p.read_text()

          # ---------------------------------------------------------------
          # 1) Apply google-services + crashlytics plugins DETERMINISTICALLY
          #    at the TOP of app/build.gradle, BEFORE any android { } block
          #    is evaluated. Otherwise the `firebaseCrashlytics { ... }`
          #    extension referenced inside buildTypes.release does not exist
          #    and Gradle throws GradleScriptException at configuration time.
          # ---------------------------------------------------------------
          # Strip ANY existing apply-plugin lines for google-services / crashlytics
          # regardless of their location (Capacitor appends google-services at the
          # BOTTOM of the file — if we leave it there, the `firebaseCrashlytics {}`
          # DSL inside buildTypes.release fires before the plugin is applied and
          # Gradle throws "Could not find method firebaseCrashlytics()").
          s = re.sub(r"(?m)^\s*apply plugin:\s*'com\.google\.gms\.google-services'\s*\n?", "", s)
          s = re.sub(r"(?m)^\s*apply plugin:\s*'com\.google\.firebase\.crashlytics'\s*\n?", "", s)
          # Also strip if they are inside a plugins { } block (modern DSL)
          s = re.sub(r"(?m)^\s*id\s+'com\.google\.gms\.google-services'.*\n?", "", s)
          s = re.sub(r"(?m)^\s*id\s+'com\.google\.firebase\.crashlytics'.*\n?", "", s)

          plugins_block_apply = (
              "apply plugin: 'com.google.gms.google-services'\n"
              "apply plugin: 'com.google.firebase.crashlytics'\n"
          )

          # Case A: modern plugins { } DSL is used by Capacitor. Inject ids INSIDE it.
          # (apply plugin can't be placed above a plugins {} block — Gradle rejects it.)
          plugins_dsl_re = re.compile(r"(plugins\s*\{)([^}]*)(\})", re.DOTALL)
          m_dsl = plugins_dsl_re.search(s)
          if m_dsl:
              inject = "\n    id 'com.google.gms.google-services'\n    id 'com.google.firebase.crashlytics'\n"
              s = s[:m_dsl.start(3)] + inject + s[m_dsl.start(3):]
              print("✅ Injected google-services + crashlytics IDs inside plugins { } DSL")
          else:
              # Case B: legacy apply plugin syntax. Anchor on com.android.application.
              anchor_re = re.compile(r"apply plugin:\s*'com\.android\.application'\s*\n")
              m = anchor_re.search(s)
              if m:
                  s = s[:m.end()] + plugins_block_apply + s[m.end():]
                  print("✅ Injected google-services + crashlytics plugins right after com.android.application")
              else:
                  s = plugins_block_apply + s
                  print("✅ Prepended google-services + crashlytics plugins at file top (no anchor found)")



          if 'compileOptions' not in s:
              s = re.sub(
                  r'(android\s*\{)',
                  r'''\1
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          ''',
                  s,
                  count=1,
              )
          else:
              s = re.sub(r'sourceCompatibility\s+JavaVersion\.VERSION_\d+', 'sourceCompatibility JavaVersion.VERSION_21', s)
              s = re.sub(r'targetCompatibility\s+JavaVersion\.VERSION_\d+', 'targetCompatibility JavaVersion.VERSION_21', s)

          if 'signingConfigs' not in s:
              s = re.sub(
                  r'(android\s*\{)',
                  r'''\1
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  }
              }
          ''',
                  s,
                  count=1,
              )

          def find_block(text, keyword, start=0):
              idx = text.find(keyword, start)
              if idx == -1:
                  return None
              brace = text.find('{', idx)
              if brace == -1:
                  return None
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return idx, brace, i
              return None

          release_block = '''release {
                  minifyEnabled true
                  shrinkResources true
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  signingConfig signingConfigs.release
                  ndk {
                      debugSymbolLevel 'FULL'
                  }
                  firebaseCrashlytics {
                      nativeSymbolUploadEnabled true
                      unstrippedNativeLibsDir 'build/intermediates/merged_native_libs/release/out/lib'
                  }
              }'''

          build_types = find_block(s, 'buildTypes')
          if build_types:
              bt_start, bt_brace, bt_end = build_types
              release = find_block(s, 'release', bt_brace)
              if release and release[0] < bt_end:
                  s = s[:release[0]] + release_block + s[release[2] + 1:]
              else:
                  s = s[:bt_brace + 1] + '\n              ' + release_block + s[bt_brace + 1:]
          else:
              android_block = find_block(s, 'android')
              if android_block:
                  s = s[:android_block[2]] + '''
              buildTypes {
                  ''' + release_block + '''
              }
          ''' + s[android_block[2]:]




          # (google-services + crashlytics plugins já foram aplicados no topo
          # do arquivo pelo bloco no início deste patch — não repetir aqui.)

          # Ensure Firebase BOM + firebase-common-ktx are present so R8 does not
          # fail with "Missing class com.google.firebase.ktx.Firebase" pulled
          # transitively by firebase-installations-ktx (google-services plugin).
          if 'firebase-bom' not in s:
              deps_match = re.search(r'(dependencies\s*\{)', s)
              if deps_match:
                  inject = (
                      "\n    implementation platform('com.google.firebase:firebase-bom:33.5.1')"
                      "\n    implementation 'com.google.firebase:firebase-common-ktx'"
                      "\n    implementation 'com.google.firebase:firebase-messaging-ktx'"
                      "\n    implementation 'com.google.firebase:firebase-installations-ktx'"
                      "\n    implementation 'com.google.firebase:firebase-crashlytics-ktx'"
                      "\n    implementation 'com.google.firebase:firebase-crashlytics-ndk'"
                  )
                  s = s[:deps_match.end()] + inject + s[deps_match.end():]
              else:
                  s += (
                      "\ndependencies {"
                      "\n    implementation platform('com.google.firebase:firebase-bom:33.5.1')"
                      "\n    implementation 'com.google.firebase:firebase-common-ktx'"
                      "\n    implementation 'com.google.firebase:firebase-messaging-ktx'"
                      "\n    implementation 'com.google.firebase:firebase-installations-ktx'"
                      "\n    implementation 'com.google.firebase:firebase-crashlytics-ktx'"
                      "\n    implementation 'com.google.firebase:firebase-crashlytics-ndk'"
                      "\n}\n"
                  )
          elif 'firebase-crashlytics' not in s:
              # BOM já existe (build anterior), só adiciona Crashlytics.
              deps_match = re.search(r'(dependencies\s*\{)', s)
              if deps_match:
                  inject = (
                      "\n    implementation 'com.google.firebase:firebase-crashlytics-ktx'"
                      "\n    implementation 'com.google.firebase:firebase-crashlytics-ndk'"
                  )
                  s = s[:deps_match.end()] + inject + s[deps_match.end():]

          # Baseline Profiles — ProfileInstaller lê baseline-prof.txt de assets/dexopt
          # e aplica AOT compilation nas classes/métodos listados no primeiro boot,
          # tornando o cold start 15-30% mais rápido em Android 9+.
          if 'androidx.profileinstaller' not in s:
              deps_match = re.search(r'(dependencies\s*\{)', s)
              if deps_match:
                  s = s[:deps_match.end()] + "\n    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'" + s[deps_match.end():]

          p.write_text(s)
          PY

          # ProGuard/R8 rules — R8 full mode aggressive optimization + safe reflection keeps.
          cat > android/app/proguard-rules.pro <<'PRO'
          # Capacitor core + plugin discovery (reflection)
          -keep,allowobfuscation,allowshrinking class com.getcapacitor.** { *; }
          -keep @com.getcapacitor.annotation.CapacitorPlugin class * { *; }
          -keepclassmembers @com.getcapacitor.annotation.CapacitorPlugin class * {
              @com.getcapacitor.PluginMethod <methods>;
          }
          -keep class * extends com.getcapacitor.Plugin { *; }

          # Firebase Messaging + GMS (Google Sign-In) — invoked via reflection.
          # allowobfuscation/allowshrinking permite R8 renomear/remover classes
          # não usadas, elevando as taxas de otimização/ofuscação/redução
          # (recomendação Play #4).
          -keep class * extends com.google.firebase.messaging.FirebaseMessagingService { *; }
          -keep,allowobfuscation,allowshrinking class com.google.firebase.iid.** { *; }
          -keep,allowobfuscation,allowshrinking class com.google.android.gms.** { *; }
          -keep,allowobfuscation,allowshrinking class com.google.firebase.** { *; }

          # Firebase Kotlin extensions (ktx) — required for Firebase Installations
          -keep,allowobfuscation,allowshrinking class com.google.firebase.ktx.** { *; }
          -keep,allowobfuscation,allowshrinking class com.google.firebase.installations.ktx.** { *; }
          -keep,allowobfuscation,allowshrinking class com.google.firebase.messaging.ktx.** { *; }
          -keep,allowobfuscation,allowshrinking class com.google.firebase.common.ktx.** { *; }


          # WebView JS bridge
          -keepclassmembers class * { @android.webkit.JavascriptInterface <methods>; }

          # Symbolication attributes for Play Console / Crashlytics
          -keepattributes SourceFile,LineNumberTable,*Annotation*,Signature,InnerClasses,EnclosingMethod
          -renamesourcefileattribute SourceFile

          # Aggressive optimizations
          -allowaccessmodification
          -repackageclasses ''

          # Silence warnings from optional transitive deps
          -dontwarn org.slf4j.**
          -dontwarn javax.annotation.**
          -dontwarn org.conscrypt.**
          -dontwarn org.bouncycastle.**
          -dontwarn org.openjsse.**
          # Firebase KTX may reference classes not present in stripped builds.
          -dontwarn com.google.firebase.ktx.**
          -dontwarn com.google.firebase.**
          -dontwarn com.google.android.gms.**
          PRO

          # ============ Baseline Profile ============
          # AGP 8.x empacota automaticamente qualquer baseline-prof.txt em
          # src/main/baseline-prof.txt como assets/dexopt/baseline.prof.
          # No primeiro boot, ProfileInstaller compila AOT as classes listadas
          # → cold start 15-30% mais rápido, scroll de listas mais estável.
          # Perfil focado em: boot Capacitor, WebView, Firebase, Splash, R8 runtime.
          mkdir -p android/app/src/main
          cat > android/app/src/main/baseline-prof.txt <<'PROF'
          HSPLcom/getcapacitor/BridgeActivity;-><init>()V
          HSPLcom/getcapacitor/BridgeActivity;->onCreate(Landroid/os/Bundle;)V
          HSPLcom/getcapacitor/BridgeActivity;->onStart()V
          HSPLcom/getcapacitor/BridgeActivity;->onResume()V
          HSPLcom/getcapacitor/Bridge;-><init>(Lcom/getcapacitor/BridgeActivity;Landroid/webkit/WebView;Ljava/util/List;Lcom/getcapacitor/CapConfig;)V
          HSPLcom/getcapacitor/Bridge;->loadWebView()V
          HSPLcom/getcapacitor/Bridge;->initWebView()V
          HSPLcom/getcapacitor/WebViewLocalServer;->shouldInterceptRequest(Landroid/webkit/WebView;Landroid/webkit/WebResourceRequest;)Landroid/webkit/WebResourceResponse;
          HSPLcom/getcapacitor/Plugin;-><init>()V
          HSPLcom/getcapacitor/PluginHandle;-><init>(Lcom/getcapacitor/Bridge;Lcom/getcapacitor/PluginManager$PluginEntry;)V
          HSPLcom/getcapacitor/MessageHandler;-><init>(Lcom/getcapacitor/Bridge;Landroid/webkit/WebView;Lcom/getcapacitor/CapacitorWebView;)V
          HSPLcom/getcapacitor/MessageHandler;->postMessage(Ljava/lang/String;)V
          HSPLandroid/webkit/WebView;-><init>(Landroid/content/Context;)V
          HSPLandroid/webkit/WebView;->loadUrl(Ljava/lang/String;)V
          HSPLandroid/webkit/WebSettings;->setJavaScriptEnabled(Z)V
          HSPLandroidx/core/splashscreen/SplashScreen;->installSplashScreen(Landroid/app/Activity;)Landroidx/core/splashscreen/SplashScreen;
          HSPLcom/google/firebase/FirebaseApp;->initializeApp(Landroid/content/Context;)Lcom/google/firebase/FirebaseApp;
          HSPLcom/google/firebase/FirebaseApp;->getInstance()Lcom/google/firebase/FirebaseApp;
          HSPLcom/google/firebase/crashlytics/FirebaseCrashlytics;->getInstance()Lcom/google/firebase/crashlytics/FirebaseCrashlytics;
          HSPLcom/google/firebase/messaging/FirebaseMessaging;->getInstance()Lcom/google/firebase/messaging/FirebaseMessaging;
          HSPLcom/google/firebase/installations/FirebaseInstallations;->getInstance()Lcom/google/firebase/installations/FirebaseInstallations;
          HSPLandroidx/profileinstaller/ProfileInstaller;->writeProfile(Landroid/content/Context;)V
          HSPLandroidx/startup/AppInitializer;->getInstance(Landroid/content/Context;)Landroidx/startup/AppInitializer;
          HSPLandroidx/lifecycle/ProcessLifecycleOwner;->get()Landroidx/lifecycle/LifecycleOwner;
          HSPLandroidx/lifecycle/LifecycleRegistry;-><init>(Landroidx/lifecycle/LifecycleOwner;)V
          HSPLandroidx/lifecycle/LifecycleRegistry;->handleLifecycleEvent(Landroidx/lifecycle/Lifecycle$Event;)V
          HSPLbr/com/vacatio/app/MainActivity;-><init>()V
          HSPLbr/com/vacatio/app/MainActivity;->onCreate(Landroid/os/Bundle;)V
          PROF
          echo "===== baseline-prof.txt ====="
          wc -l android/app/src/main/baseline-prof.txt





          echo "===== Java/Gradle versions ====="
          java -version
          (cd android && ./gradlew --version --no-daemon)
          echo "===== android/gradle.properties ====="
          grep -E 'org.gradle.java.home|android.useAndroidX|android.enableJetifier' android/gradle.properties || true
          echo "===== android/build.gradle (numbered) ====="
          cat -n android/build.gradle
          echo "===== android/app/build.gradle (numbered) ====="
          cat -n android/app/build.gradle
          echo "===== android/variables.gradle (numbered) ====="
          cat -n android/variables.gradle || echo "(variables.gradle not found)"

      - name: Add Facebook SDK for install/ad tracking (Meta Ads)
        # SDK nativo do Facebook — necessário pro Meta Ads atribuir instalações
        # via Google Play Install Referrer. App ID 1590734976033061, Client
        # Token d0f7c8833c75e815d78c81ac5f4b6fb3 (Key Hash de release já
        # validado no Meta for Developers).
        run: |
          set -euo pipefail

          # 1) strings.xml — facebook_app_id + facebook_client_token
          mkdir -p android/app/src/main/res/values
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/res/values/strings.xml')
          if not p.exists():
              p.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n')
          s = p.read_text()
          entries = {
              'facebook_app_id': '1590734976033061',
              'fb_login_protocol_scheme': 'fb1590734976033061',
              'facebook_client_token': 'd0f7c8833c75e815d78c81ac5f4b6fb3',
          }
          for name, val in entries.items():
              pat = re.compile(r'<string\s+name="' + re.escape(name) + r'"[^>]*>[^<]*</string>')
              line = f'    <string name="{name}">{val}</string>'
              if pat.search(s):
                  s = pat.sub(line.strip(), s)
              else:
                  s = s.replace('</resources>', line + '\n</resources>', 1)
          p.write_text(s)
          print('✅ facebook_app_id + client_token gravados em strings.xml')
          PY

          # 2) AndroidManifest — meta-data dentro de <application> + INTERNET perm
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          if 'android.permission.INTERNET' not in s:
              s = s.replace('</manifest>',
                  '    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>', 1)

          meta = (
              '        <meta-data android:name="com.facebook.sdk.ApplicationId" '
              'android:value="@string/facebook_app_id" />\n'
              '        <meta-data android:name="com.facebook.sdk.ClientToken" '
              'android:value="@string/facebook_client_token" />\n'
              '        <meta-data android:name="com.facebook.sdk.AutoInitEnabled" '
              'android:value="true" />\n'
              '        <meta-data android:name="com.facebook.sdk.AutoLogAppEventsEnabled" '
              'android:value="true" />\n'
              '        <meta-data android:name="com.facebook.sdk.AdvertiserIDCollectionEnabled" '
              'android:value="true" />\n'
          )
          if 'com.facebook.sdk.ApplicationId' not in s:
              # Injeta antes do </application>
              s = re.sub(r'(\s*)</application>', '\n' + meta + r'\1</application>', s, count=1)
              print('✅ Facebook meta-data injetado no AndroidManifest')
          else:
              print('Facebook meta-data já presente — mantendo')

          Path(p).write_text(s)
          PY

          # 3) app/build.gradle — dependência do Facebook SDK
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'com.facebook.android:facebook-android-sdk' not in s:
              inject = "\n    implementation 'com.facebook.android:facebook-android-sdk:17.0.2'"
              m = re.search(r'(dependencies\s*\{)', s)
              if m:
                  s = s[:m.end()] + inject + s[m.end():]
              else:
                  s += "\ndependencies {" + inject + "\n}\n"
              p.write_text(s)
              print('✅ facebook-android-sdk 17.0.2 adicionado às dependencies')
          else:
              print('facebook-android-sdk já presente')
          PY

          echo "===== strings.xml ====="
          cat android/app/src/main/res/values/strings.xml
          echo "===== AndroidManifest (application block) ====="
          grep -n 'facebook' android/app/src/main/AndroidManifest.xml || true

      - name: Decode keystore

        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "❌ Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "❌ ANDROID_KEYSTORE_BASE64 decoded to an empty file"
            exit 1
          fi
          ls -la android/app/upload-keystore.jks

      - name: Validate keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing secret ${secret_name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          set +e
          store_output=$(keytool -list -keystore android/app/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1)
          store_status=$?
          set -e
          if [ "$store_status" -ne 0 ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 existe, mas ANDROID_KEYSTORE_PASSWORD não abre esse .jks/.p12. Atualize esse secret com a senha do arquivo keystore."
            printf '%s\n' "$store_output" | tail -n 20
            exit 1
          fi
          echo "✅ Keystore abre com ANDROID_KEYSTORE_PASSWORD"

          set +e
          alias_output=$(keytool -list -keystore android/app/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>&1)
          alias_status=$?
          set -e
          if [ "$alias_status" -ne 0 ]; then
            echo "::error::ANDROID_KEY_ALIAS não existe nesse keystore. Confira se o alias cadastrado no GitHub é o mesmo usado ao gerar a chave."
            echo "Aliases encontrados no keystore:"
            printf '%s\n' "$store_output" | grep -E '^[^,]+, ' | sed 's/,.*//' | sed 's/^/- /' || true
            printf '%s\n' "$alias_output" | tail -n 20
            exit 1
          fi
          echo "✅ Alias do keystore encontrado"

          EFFECTIVE_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          if [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "ℹ️ Validando chave privada com ANDROID_KEY_PASSWORD"
          else
            echo "ℹ️ ANDROID_KEY_PASSWORD não configurado; usando ANDROID_KEYSTORE_PASSWORD como senha da chave"
          fi

          # Valida a KEY PASSWORD tentando importar a entrada assinante para
          # outro keystore temporário. Isso força o keytool a abrir a chave
          # privada com -srckeypass, sem expor nenhuma senha no log.
          # Compatível com JKS e PKCS12 (.p12) — o comando -keypasswd não funciona em PKCS12.
          set +e
          rm -f /tmp/test-export.jks
          keypass_output=$(keytool -importkeystore \
            -srckeystore android/app/upload-keystore.jks \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass "$EFFECTIVE_KEY_PASSWORD" \
            -destkeystore /tmp/test-export.jks \
            -deststoretype JKS \
            -deststorepass "testtest" \
            -destkeypass "testtest" -noprompt 2>&1)
          keypass_status=$?
          set -e
          rm -f /tmp/test-export.jks
          if [ "$keypass_status" -ne 0 ]; then
            echo "::error::O keystore abriu e o alias existe, mas a chave privada não abriu com a senha efetiva. Corrija ANDROID_KEY_PASSWORD (ou remova o secret para usar ANDROID_KEYSTORE_PASSWORD como fallback)."
            printf '%s\n' "$keypass_output" | tail -n 10
            exit 1
          fi
          echo "✅ Senha efetiva da chave privada validada"

          release_sha1=$(keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" 2>/dev/null \
            | awk -F': ' '/SHA1:/ {print tolower($2); exit}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')

          if [ -z "$release_sha1" ]; then
            echo "::error::Não consegui extrair o SHA-1 do keystore de release."
            exit 1
          fi

          # Formata com dois-pontos maiúsculos para comparação visual com Google Cloud
          release_sha1_formatted=$(echo "$release_sha1" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')
          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "🔑 SHA-1 DO KEYSTORE DE RELEASE (o que assina este APK/AAB):"
          echo ""
          echo "   $release_sha1_formatted"
          echo ""
          echo "   Compare com o SHA-1 cadastrado no Google Cloud Console:"
          echo "   → OAuth Android 'Vacatio Android' deve ter EXATAMENTE este valor."
          echo "   → Esperado (o que você já tem no Google Cloud):"
          echo "     59:96:8B:B9:5A:98:68:C9:8C:CC:83:88:DE:0D:56:8D:F5:76:B4:B6"
          echo "════════════════════════════════════════════════════════════════"
          echo ""

          expected_google_cloud="59968bb95a9868c98ccc8388de0d568df576b4b6"
          if [ "$release_sha1" = "$expected_google_cloud" ]; then
            echo "✅ SHA-1 do keystore BATE com o cadastrado no Google Cloud."
          else
            echo "::warning::⚠️ SHA-1 do keystore de release NÃO bate com o cadastrado no Google Cloud OAuth Android."
            echo "::warning::Atual (keystore): $release_sha1_formatted"
            echo "::warning::Cadastrado (Google Cloud): 59:96:8B:B9:5A:98:68:C9:8C:CC:83:88:DE:0D:56:8D:F5:76:B4:B6"
            echo "::warning::AÇÃO: Vá em Google Cloud → APIs & Services → Credentials → 'Vacatio Android' e substitua o SHA-1 pelo valor atual acima. O login Google vai falhar até corrigir."
          fi

          # ────────────────────────────────────────────────────────────────
          # 🔑 Facebook Key Hash (Meta Developers → Configurações do app Android)
          # Fórmula oficial: base64( sha1( bytes DER do certificado de release ) )
          # Rode uma vez, copie o valor abaixo pro painel do Facebook, e depois
          # este passo pode ser removido do workflow.
          # ────────────────────────────────────────────────────────────────
          fb_key_hash=$(keytool -exportcert \
            -alias "$ANDROID_KEY_ALIAS" \
            -keystore android/app/upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
            | openssl sha1 -binary \
            | openssl base64)

          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "📘 FACEBOOK KEY HASH (cole no Meta Developers → Android):"
          echo ""
          echo "   $fb_key_hash"
          echo ""
          echo "   Onde colar: developers.facebook.com → seu app → Configurações"
          echo "   → Básico → plataforma Android → campo 'Hashes de chaves'."
          echo "════════════════════════════════════════════════════════════════"
          echo ""




          expected_sha1=$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('android-config/google-services.json').read_text())
          hashes = []
          for client in data.get('client', []):
              for oauth in client.get('oauth_client', []):
                  info = oauth.get('android_info', {})
                  if oauth.get('client_type') == 1 and info.get('package_name') == 'br.com.vacatio.app':
                      h = info.get('certificate_hash')
                      if h:
                          hashes.append(h.lower().replace(':', ''))
          print('\n'.join(hashes))
          PY
          )

          if ! printf '%s\n' "$expected_sha1" | grep -qx "$release_sha1"; then
            echo "::warning::O SHA-1 da chave que assinou este APK/AAB não está no google-services.json. O build vai continuar, mas o login Google nativo vai falhar com 12501/10 até corrigir o OAuth Android."
            echo "SHA-1 da chave de release atual: $release_sha1"
            echo "SHA-1 cadastrados no google-services.json para br.com.vacatio.app:"
            printf '%s\n' "$expected_sha1" | sed 's/^/- /'
            echo "Adicione esse SHA-1 ao OAuth Android no Google Cloud/Firebase, baixe novo google-services.json e rode o build novamente."
            {
              echo "### ⚠️ Google Sign-In Android — SHA-1 diferente"
              echo ""
              echo "O APK/AAB será gerado, mas o login Google nativo vai falhar até o OAuth Android aceitar a chave de assinatura atual."
              echo ""
              echo "- SHA-1 da chave que assinou este build: \`$release_sha1_formatted\`"
              echo "- SHA-1 no google-services.json:"
              printf '%s\n' "$expected_sha1" | sed 's/^/  - `/' | sed 's/$/`/'
              echo ""
              echo "Corrija em Google Cloud/Firebase → OAuth client Android do pacote \`br.com.vacatio.app\`, depois baixe/suba o novo \`google-services.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ SHA-1 de release presente no OAuth Android do google-services.json: $release_sha1"
          fi


      - name: Ensure Android compatibility settings
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()

          # 1) minSdkVersion → SEMPRE literal 30. Cobre 3 formas que o Capacitor pode gerar:
          #    a) `minSdkVersion 22`
          #    b) `minSdkVersion rootProject.ext.minSdkVersion`
          #    c) `minSdk 22` / `minSdk = 22` (AGP 8 DSL)
          # Se qualquer forma existir, força para `minSdkVersion 30`. Sem isso, um
          # `rootProject.ext.minSdkVersion` deixado no arquivo vira null e explode
          # com "A problem occurred evaluating project ':app'  Value is null".
          before = s
          s = re.sub(r'\bminSdkVersion\s+[A-Za-z0-9_.]+', 'minSdkVersion 30', s)
          s = re.sub(r'\bminSdk\b\s*=?\s*[A-Za-z0-9_.]+', 'minSdkVersion 30', s)
          if s == before:
              # Não encontrou — injeta dentro de defaultConfig { }
              s = re.sub(r'(defaultConfig\s*\{)', r'\1\n        minSdkVersion 30', s, count=1)
          assert 'rootProject.ext.minSdkVersion' not in s, 'minSdkVersion patch falhou (referência a rootProject.ext.* ainda presente)'

          # 1b) targetSdkVersion — força para 36 (Android 16). Play Store exige API 34+ em 2025.
          s = re.sub(r'\btargetSdkVersion\s+rootProject\.ext\.[A-Za-z0-9_.]+', 'targetSdkVersion 36', s)
          s = re.sub(r'\btargetSdk\b\s*=?\s*rootProject\.ext\.[A-Za-z0-9_.]+', 'targetSdkVersion 36', s)
          s = re.sub(r'\btargetSdkVersion\s+\d+', 'targetSdkVersion 36', s)

          # 1c) compileSdkVersion — força para 36 (alguns AARs do Capacitor exigem 36).
          s = re.sub(r'\bcompileSdkVersion\s+rootProject\.ext\.[A-Za-z0-9_.]+', 'compileSdkVersion 36', s)
          s = re.sub(r'\bcompileSdk\b\s*=?\s*rootProject\.ext\.[A-Za-z0-9_.]+', 'compileSdkVersion 36', s)
          s = re.sub(r'\bcompileSdkVersion\s+\d+', 'compileSdkVersion 36', s)

          # 2) abiFilters com todas as 4 ABIs.
          if 'abiFilters' not in s:
              s = re.sub(
                  r'(defaultConfig\s*\{)',
                  r'''\1
              ndk {
                  abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
              }''',
                  s,
                  count=1,
              )
          else:
              s = re.sub(
                  r'abiFilters[^\n]*',
                  'abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"',
                  s,
                  count=1,
              )

          # 3) bundle splits — mantém todas densidades/idiomas.
          if re.search(r'\bbundle\s*\{', s) is None:
              s = re.sub(
                  r'(android\s*\{)',
                  r'''\1
              bundle {
                  language { enableSplit = false }
                  density  { enableSplit = false }
                  abi      { enableSplit = true }
              }''',
                  s,
                  count=1,
              )

          p.write_text(s)
          print('✅ minSdk=30, targetSdk=36, compileSdk=36, abiFilters=all4, bundle splits ajustados')

          # 4) variables.gradle — força valores mínimos consistentes.
          v = Path('android/variables.gradle')
          if v.exists():
              vs = v.read_text()
              new_vs = vs
              new_vs = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 30', new_vs)
              new_vs = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', new_vs)
              new_vs = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', new_vs)
              if new_vs != vs:
                  v.write_text(new_vs)
                  print('✅ variables.gradle alinhado (min=30, target=36, compile=36)')
              else:
                  print('ℹ️  variables.gradle sem literais para patchar')
          PY


      - name: Validate Android minSdk
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          checks = [
              Path('android/app/build.gradle'),
              Path('android/variables.gradle'),
              Path('android/app/src/main/AndroidManifest.xml'),
          ]
          failed = False
          for path in checks:
              if not path.exists():
                  continue
              text = path.read_text()
              # Bloqueia qualquer minSdkVersion menor que 30 (Android 10).
              gradle_matches = re.findall(r'\bminSdkVersion\s*(?:=\s*)?(\d+)\b', text)
              manifest_matches = re.findall(r'android:minSdkVersion="(\d+)"', text)
              for v in gradle_matches + manifest_matches:
                  if int(v) < 29:
                      print(f'❌ minSdkVersion {v} encontrado em {path} (mínimo exigido: 30 / Android 11)')
                      failed = True
              values = gradle_matches + manifest_matches
              if values:
                  print(f'→ {path}: minSdkVersion {", ".join(values)}')

          if failed:
              raise SystemExit('minSdkVersion < 30 detectado; o app exige Android 11 (API 30) ou superior.')
          print('✅ minSdk validado: todos os valores >= 30 (Android 11)')

          PY



      - name: Auto-bump versionCode/versionName
        run: |
          python3 - <<'PY'
          import json, os, re, time
          from pathlib import Path

          # ------------------------------------------------------------------
          # Contador persistente em .build-version.json (commitado no repo).
          # Antes usávamos github.run_number, que zera ao remixar o projeto
          # pra outro repositório e quebrava a continuidade da numeração
          # publicada na Play Store. Agora o número vive no código: cada
          # build lê o último valor, incrementa, aplica no build.gradle e o
          # próximo step commita o arquivo de volta. Assim, remix → clone →
          # build continua de onde parou, sem colisão de versionCode.
          # ------------------------------------------------------------------
          state_path = Path('.build-version.json')
          if state_path.exists():
              state = json.loads(state_path.read_text())
          else:
              state = {'buildNumber': 2, 'versionCode': 0, 'versionName': '1.0.64'}

          build_number = int(state.get('buildNumber', 2)) + 1

          # versionCode: sempre cresce. max(timestamp UTC, ultimo+1) cobre
          # o caso normal (timestamp maior) e o caso de relógio adiantado
          # num commit antigo (ultimo+1 maior).
          FLOOR = 1064
          ts_code = int(time.strftime('%y%j%H%M', time.gmtime()))
          last_code = int(state.get('versionCode', 0) or 0)
          version_code = max(ts_code, last_code + 1, FLOOR)
          assert version_code < 2_100_000_000, f'versionCode {version_code} excede o limite do Android'

          # versionName derivado do buildNumber persistente. Mesma regra do
          # esquema antigo (que usava run_number) — só a fonte mudou.
          #   build #3   → 1.0.65        build #38  → 1.1.0
          #   build #37  → 1.0.99        build #138 → 1.2.0
          BASE_BUILD = 3
          BASE_PATCH = 65
          k = max(build_number - BASE_BUILD, 0)
          if k <= (99 - BASE_PATCH):
              version_name = f"1.0.{BASE_PATCH + k}"
          else:
              m = k - (99 - BASE_PATCH) - 1
              cycle = m // 100
              pos = m % 100
              minor = 1 + cycle
              version_name = f"1.{minor}.0" if pos == 0 else f"1.{minor}.0.{pos}"


          p = Path('android/app/build.gradle')
          s = p.read_text()

          new_s = re.sub(r'\bversionCode\s*=?\s*[A-Za-z0-9_.]+', f'versionCode {version_code}', s, count=1)
          if new_s == s:
              new_s = re.sub(r'(defaultConfig\s*\{)', rf'\1\n        versionCode {version_code}', new_s, count=1)
          s = new_s

          new_s = re.sub(r'\bversionName\s*=?\s*(?:"[^"]*"|rootProject\.ext\.[A-Za-z0-9_.]+|[A-Za-z0-9_.]+)', f'versionName "{version_name}"', s, count=1)
          if new_s == s:
              new_s = re.sub(r'(defaultConfig\s*\{)', rf'\1\n        versionName "{version_name}"', new_s, count=1)
          s = new_s

          assert 'rootProject.ext.versionCode' not in s
          assert 'rootProject.ext.versionName' not in s
          assert re.search(rf'versionCode\s+{version_code}\b', s)
          assert re.search(rf'versionName\s+"{re.escape(version_name)}"', s)

          p.write_text(s)
          print(f'✅ build #{build_number}  versionCode={version_code}  versionName={version_name}')

          # Atualiza o arquivo persistente. É commitado no step "Persist
          # version bump" SÓ se a build passar até o fim (evita queimar
          # número em falha).
          state.update({
              'buildNumber': build_number,
              'versionCode': version_code,
              'versionName': version_name,
              '_comment': state.get('_comment') or 'Atualizado automaticamente pelo workflow Build Android.',
          })
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n')

          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'APP_VERSION_NAME={version_name}\n')
              env.write(f'APP_VERSION_CODE={version_code}\n')
              env.write(f'APP_BUILD_NUMBER={build_number}\n')
              env.write(f'ARTIFACT_BASENAME=app-vacatio-{version_name}\n')
          PY



      - name: Rotular run com versão + commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s | tr -d '\r' | cut -c1-80)
          COMMIT_AUTHOR=$(git log -1 --pretty='%an')
          TITLE="v${APP_VERSION_NAME} (build ${APP_VERSION_CODE}) • ${SHORT_SHA} • ${COMMIT_MSG}"
          echo "🏷️  $TITLE"
          {
            echo "## 📦 Build Vacatio"
            echo ""
            echo "| Campo | Valor |"
            echo "| --- | --- |"
            echo "| **versionName** | \`${APP_VERSION_NAME}\` |"
            echo "| **versionCode** | \`${APP_VERSION_CODE}\` |"
            echo "| **buildNumber** | \`${APP_BUILD_NUMBER}\` |"
            echo "| **commit** | \`${SHORT_SHA}\` — ${COMMIT_MSG} |"
            echo "| **autor** | ${COMMIT_AUTHOR} |"
            echo "| **branch** | \`${GITHUB_REF_NAME}\` |"
            echo "| **artefato** | \`${ARTIFACT_BASENAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Renomeia o run para "v1.0.X (build N) • sha • commit msg"
          # O campo correto na API do GitHub é `display_title`, não `name`.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f display_title="$TITLE" \
            && echo "✅ Run renomeado para: $TITLE" \
            || echo "⚠️  Não consegui renomear o run (title completo no summary abaixo)."


