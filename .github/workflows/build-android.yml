name: Build Android (.aab + .apk)
run-name: "Build #${{ github.run_number }} • ${{ github.ref_name }}@${{ github.sha }}"



on:
  # ⚠️ Trigger automático em push desativado para economizar minutos do GitHub Actions.
  # Para rodar a build, vá em Actions → "Build Android (.aab + .apk)" → "Run workflow".
  workflow_dispatch:
    inputs:
      mobile_config_urls:
        description: 'Signed URLs dos arquivos nativos salvos no Supabase'
        required: false
        default: ''

jobs:
  build:
    name: Build Android release
    runs-on: ubuntu-latest
    # Necessário pro step "Persist version bump" commitar de volta o
    # .build-version.json atualizado usando o GITHUB_TOKEN.
    permissions:
      contents: write
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify Java and Android tools
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0|platform-tools' || true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Remove Lovable hot-reload from capacitor.config.ts
        run: |
          node -e "
            const fs = require('fs');
            const p = 'capacitor.config.ts';
            let s = fs.readFileSync(p, 'utf8');
            s = s.replace(/\s*server:\s*{[\s\S]*?},?\n/, '\n');
            fs.writeFileSync(p, s);
            console.log('capacitor.config.ts sanitized for release');
          "

      - name: Build web app
        env:
          SKIP_PRECOMPRESS: "1"
        run: bun run build

      - name: Strip precompressed assets (safety net for native)
        run: |
          # Belt-and-suspenders: mesmo com SKIP_PRECOMPRESS=1, qualquer .gz/.br
          # que sobrar em dist/ vira "Duplicate resources" no mergeReleaseResources
          # do Android (o Asset Merger tira a extensão e vê foo.js e foo.js.gz
          # como o mesmo recurso). Apagar aqui garante que a árvore copiada pelo
          # cap sync só contenha os arquivos originais.
          if [ -d dist ]; then
            removed=$(find dist \( -name '*.gz' -o -name '*.br' \) -type f -print -delete | wc -l)
            echo "Removed $removed precompressed files from dist/"
          fi

      - name: Export laws bundle (native offline data)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://iftdrbxvekrhzstayjwp.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          LAWS_BUNDLE_OUT: dist/laws-bundle
        run: |
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::VITE_SUPABASE_PUBLISHABLE_KEY não definido — pulando bundle offline"
          else
            node scripts/export-laws.mjs
            ls -lh dist/laws-bundle | head -20
            du -sh dist/laws-bundle
          fi


      - name: Regenerate Android platform
        run: |
          # Sempre recria a pasta nativa para eliminar referências antigas de
          # plugins removidos que podem ter ficado em settings.gradle/build.gradle
          # após builds anteriores.
          rm -rf android
          bunx cap add android
          chmod +x android/gradlew

      - name: Bump AGP + Gradle wrapper + force modern Android deps
        run: |
          # ----------------------------------------------------------------
          # Play Console recomendação #3: "Atualize o Plug-in do Android para
          # Gradle para a versão 9.0 ou mais recente".
          # AGP 8.13 é a última linha 8.x estável em nov/2025 e casa com
          # Gradle 8.14 + JDK 21. AGP 9.0 é experimental e ainda quebra
          # plugins Capacitor 8 comuns — subimos AGP para o maior 8.x
          # estável (elimina múltiplos warnings de APIs deprecadas mesmo
          # que o alerta específico "AGP 9.0" só limpe no bump seguinte).
          # ----------------------------------------------------------------
          AGP_VERSION='8.13.0'
          GRADLE_DIST='gradle-8.14-bin.zip'

          sed -i "s|classpath 'com.android.tools.build:gradle:[^']*'|classpath 'com.android.tools.build:gradle:${AGP_VERSION}'|" android/build.gradle
          echo "AGP forçado para ${AGP_VERSION}:"
          grep "com.android.tools.build:gradle" android/build.gradle || true

          sed -i "s|distributionUrl=.*|distributionUrl=https\\\\://services.gradle.org/distributions/${GRADLE_DIST}|" android/gradle/wrapper/gradle-wrapper.properties
          echo "Gradle wrapper:"
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

          # ----------------------------------------------------------------
          # Play Console recomendação #2: "O app usa APIs ou parâmetros
          # descontinuados para exibição de ponta a ponta".
          # Origens apontadas: Material BottomSheetDialog, ML Kit code
          # scanner + vision barcode, CameraX ImageCapture, Play Services
          # internos. Forçamos as versões mais recentes via resolutionStrategy
          # em allprojects — pega bibliotecas transitivas dos plugins Capacitor.
          # ----------------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/build.gradle')
          s = p.read_text()
          block = """
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      // Material Components 1.13.x migrou BottomSheetDialog para
                      // APIs de WindowInsets não deprecadas (Play alert #2).
                      force 'com.google.android.material:material:1.13.0'
                      // CameraX 1.5.x removeu chamadas a Window.setStatusBarColor
                      // no ImageCapture$Defaults.
                      force 'androidx.camera:camera-core:1.5.0'
                      force 'androidx.camera:camera-camera2:1.5.0'
                      force 'androidx.camera:camera-lifecycle:1.5.0'
                      force 'androidx.camera:camera-view:1.5.0'
                      // ML Kit barcode + code scanner (pull transitivo do plugin
                      // @capacitor-mlkit/barcode-scanning). Versões mais novas
                      // migram para APIs modernas de janela.
                      force 'com.google.mlkit:barcode-scanning:17.3.0'
                      force 'com.google.android.gms:play-services-code-scanner:16.1.0'
                      // Play Services base — origem de zza.onStart deprecado.
                      force 'com.google.android.gms:play-services-base:18.5.0'
                      force 'com.google.android.gms:play-services-basement:18.4.0'
                  }
              }
          }
          """
          if 'resolutionStrategy' not in s:
              s = s.rstrip() + '\n' + block + '\n'
              p.write_text(s)
              print('✅ resolutionStrategy adicionado ao build.gradle root')
          else:
              print('resolutionStrategy já presente — mantendo')
          PY



      - name: Add Play Billing + Foreground Location perms & REMOVE USE_EXACT_ALARM
        # Vacatio não é despertador/agenda, então não podemos declarar
        # USE_EXACT_ALARM (Play Console policy). O plugin @capacitor/local-notifications
        # adiciona ela via manifest merger — precisamos removê-la explicitamente
        # com tools:node="remove". Mantemos apenas SCHEDULE_EXACT_ALARM, que é
        # concedida pelo usuário nas configs (sem declaração no Play).
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          # Garante xmlns:tools no <manifest>
          if 'xmlns:tools=' not in s:
              s = s.replace(
                  '<manifest ',
                  '<manifest xmlns:tools="http://schemas.android.com/tools" ',
                  1,
              )

          perms_add = [
              'com.android.vending.BILLING',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.ACCESS_BACKGROUND_LOCATION',
          ]
          added = []
          for perm in perms_add:
              if perm not in s:
                  line = f'    <uses-permission android:name="{perm}" />\n'
                  s = s.replace('</manifest>', line + '</manifest>', 1)
                  added.append(perm)

          # Remove USE_EXACT_ALARM se algum step antigo adicionou
          import re
          s = re.sub(
              r'\s*<uses-permission[^/]*android:name="android\.permission\.USE_EXACT_ALARM"[^/]*/>',
              '',
              s,
          )
          # Bloqueia o merger do manifest do plugin de re-adicionar
          remove_line = '    <uses-permission android:name="android.permission.USE_EXACT_ALARM" tools:node="remove" />\n'
          if 'USE_EXACT_ALARM" tools:node="remove"' not in s:
              s = s.replace('</manifest>', remove_line + '</manifest>', 1)

          p.write_text(s)
          print('Permissions added:', added)
          print('USE_EXACT_ALARM: removed + blocked from manifest merger')
          PY


      - name: Download native config from Supabase
        env:
          MOBILE_CONFIG_URLS: ${{ github.event.inputs.mobile_config_urls }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from pathlib import Path

          raw = (os.environ.get('MOBILE_CONFIG_URLS') or '').strip()
          if not raw or raw.lower() in ('null', 'none', '{}'):
              print('No Supabase mobile config URLs received; using repository defaults when available.')
              sys.exit(0)

          try:
              urls = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f'::warning::MOBILE_CONFIG_URLS is not valid JSON ({e}); using repository defaults when available.')
              sys.exit(0)

          if not isinstance(urls, dict) or not urls:
              print('MOBILE_CONFIG_URLS parsed but empty; using repository defaults when available.')
              sys.exit(0)
          targets = {
              'google-services.json': Path('android-config/google-services.json'),
              'icon.png': Path('assets/icon.png'),
              'icon-foreground.png': Path('assets/icon-foreground.png'),
              'icon-background.png': Path('assets/icon-background.png'),
              'splash.png': Path('assets/splash.png'),
              'splash-dark.png': Path('assets/splash-dark.png'),
              'notification-icon.png': Path('assets/notification-icon.png'),
              'app-name.txt': Path('assets/app-name.txt'),
          }

          for name, target in targets.items():
              url = urls.get(name)
              if not url:
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(url, timeout=60) as response:
                  target.write_bytes(response.read())
              print(f'Downloaded {name} -> {target}')
          PY

      - name: Seed native image assets from resources/ (fallback)
        run: |
          mkdir -p assets
          # Copy every source PNG from resources/ into assets/ unless a Supabase
          # download already placed a newer file there. resources/ is the
          # documented source of truth (see resources/README.md).
          for f in resources/*.png; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if [ ! -f "assets/$name" ]; then
              cp "$f" "assets/$name"
              echo "Seeded assets/$name from resources/"
            fi
          done
          ls -la assets/ || true

      - name: Generate Android icons and splash
        run: |
          # Splash em fundo ESCURO (#1a0a14 = mesma cor de capacitor.config.ts →
          # SplashScreen.backgroundColor). Antes estava #EFE039 (amarelo brand),
          # o que fazia o windowBackground/Android 12 SplashScreen deixar uma
          # faixa amarela com o logo comprimido visível no topo enquanto a
          # WebView carregava e, em edge-to-edge, também depois — a WebView
          # não cobre 100% dos pixels acima da status bar em todos os aparelhos.
          # Ícone do launcher segue amarelo (é o ícone na home, não afeta a UI).
          if [ -d assets ] && ls assets/*.png >/dev/null 2>&1; then
            bunx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#EFE039' --iconBackgroundColorDark '#EFE039' --splashBackgroundColor '#FFD500' --splashBackgroundColorDark '#FFD500'
          else
            echo "No native image assets found; skipping capacitor-assets."
          fi

      - name: Override Android launch theme (kill splash/actionbar strip)
        run: |
          # A faixa preta com "Vacatio" não é React: é a splash compat/
          # ActionBar nativa aparecendo antes/depois da WebView. A própria doc
          # do @capacitor/splash-screen orienta desativar a compat library
          # trocando AppTheme.NoActionBarLaunch de Theme.SplashScreen para
          # AppTheme.NoActionBar. O Android 12+ ainda terá splash do SO, mas
          # sem a ActionBar preta/label vazando sobre o app.
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-v31 android/app/src/main/res/values-night-v31

          # colors.xml — merge idempotente do splash_bg
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/res/values/colors.xml')
          if not p.exists():
              p.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n')
          s = p.read_text()
          if 'name="splash_bg"' not in s:
              s = s.replace('</resources>', '    <color name="splash_bg">#FFD500</color>\n</resources>')
              print('splash_bg color added')
          else:
              print('splash_bg color already present')
          if 'name="app_bg"' not in s:
              # Fundo escuro do app — usado no windowBackground base pra impedir
              # que dialogs do sistema (copiar/colar, Credential Manager) puxem
              # o splash amarelo como fundo flutuante.
              s = s.replace('</resources>', '    <color name="app_bg">#0a0f1a</color>\n</resources>')
              print('app_bg color added')
          else:
              print('app_bg color already present')
          p.write_text(s)
          PY

          # values-v31/styles.xml — NÃO usar Theme.SplashScreen compat aqui.
          # Ele é o suspeito principal da barra preta com label.
          cat > android/app/src/main/res/values-v31/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@color/splash_bg</item>
                  <item name="android:windowBackground">@color/splash_bg</item>
                  <item name="android:windowSplashScreenBackground">@color/splash_bg</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">@color/splash_bg</item>
                  <item name="android:windowSplashScreenBrandingImage">@null</item>
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
              </style>
          </resources>
          XML

          cat > android/app/src/main/res/values-night-v31/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@color/splash_bg</item>
                  <item name="android:windowBackground">@color/splash_bg</item>
                  <item name="android:windowSplashScreenBackground">@color/splash_bg</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">@color/splash_bg</item>
                  <item name="android:windowSplashScreenBrandingImage">@null</item>
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
              </style>
          </resources>
          XML

          # values/styles.xml — garante windowBackground escuro no tema base
          # (Android < 12 e transições depois do splash).
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/res/values/styles.xml')
          if not p.exists():
              print('styles.xml não existe — pulando patch base')
          else:
              s = p.read_text()
              def replace_or_add_style(text, style_name, parent, items):
                  pat = re.compile(
                      r'\s*<style\s+name="' + re.escape(style_name) + r'"[^>]*>.*?</style>\s*',
                      re.S,
                  )
                  block = '    <style name="{}" parent="{}">\n{}    </style>\n'.format(
                      style_name,
                      parent,
                      ''.join('        <item name="{}">{}</item>\n'.format(k, v) for k, v in items),
                  )
                  if pat.search(text):
                      return pat.sub('\n' + block, text, count=1)
                  return text.replace('</resources>', block + '</resources>', 1)

              s2 = replace_or_add_style(s, 'AppTheme.NoActionBar', 'Theme.AppCompat.DayNight.NoActionBar', [
                  ('windowActionBar', 'false'),
                  ('windowNoTitle', 'true'),
                  ('android:windowActionBar', 'false'),
                  ('android:windowNoTitle', 'true'),
                  ('android:windowContentOverlay', '@null'),
                  ('android:windowBackground', '@color/app_bg'),
              ])
              s2 = replace_or_add_style(s2, 'AppTheme.NoActionBarLaunch', 'AppTheme.NoActionBar', [
                  ('android:background', '@color/splash_bg'),
                  ('android:windowBackground', '@color/splash_bg'),
                  ('windowActionBar', 'false'),
                  ('windowNoTitle', 'true'),
                  ('android:windowActionBar', 'false'),
                  ('android:windowNoTitle', 'true'),
              ])
              if s2 != s:
                  p.write_text(s2)
                  print('base styles.xml reescrito: launch parent=AppTheme.NoActionBar')
              else:
                  print('base styles.xml sem alterações necessárias')
          PY

          echo "✅ Android launch theme forçado sem Theme.SplashScreen compat"

      - name: Force NoActionBar + clear MainActivity label (kill "Vacatio" strip)
        run: |
          # Faixa preta com "Vacatio" no topo do app = ActionBar/Toolbar do
          # sistema renderizando `android:label` da MainActivity. Se o tema
          # efetivo cair pra qualquer variante com ActionBar (ex.: build pulou
          # o postSplashScreenTheme), o Android desenha essa faixa. Aqui a
          # gente força NoActionBar no tema base E zera o label da activity.
          python3 - <<'PY'
          import re
          from pathlib import Path

          # --- 1. Reescreve AppTheme.NoActionBar em values/styles.xml ---
          p = Path('android/app/src/main/res/values/styles.xml')
          if p.exists():
              s = p.read_text()
              # Bloco canônico — substitui totalmente o AppTheme.NoActionBar existente
              canonical = (
                  '    <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">\n'
                  '        <item name="windowActionBar">false</item>\n'
                  '        <item name="windowNoTitle">true</item>\n'
                  '        <item name="android:windowActionBar">false</item>\n'
                  '        <item name="android:windowNoTitle">true</item>\n'
                  '        <item name="android:windowContentOverlay">@null</item>\n'
                  '        <item name="android:windowBackground">@color/app_bg</item>\n'
                  '    </style>\n'
              )
              launch = (
                  '    <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">\n'
                  '        <item name="android:background">@color/splash_bg</item>\n'
                  '        <item name="android:windowBackground">@color/splash_bg</item>\n'
                  '        <item name="windowActionBar">false</item>\n'
                  '        <item name="windowNoTitle">true</item>\n'
                  '        <item name="android:windowActionBar">false</item>\n'
                  '        <item name="android:windowNoTitle">true</item>\n'
                  '    </style>\n'
              )
              pat = re.compile(r'<style\s+name="AppTheme\.NoActionBar"[^>]*>.*?</style>\s*', re.S)
              if pat.search(s):
                  s = pat.sub(canonical, s)
              else:
                  s = s.replace('</resources>', canonical + '</resources>')
              launch_pat = re.compile(r'<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>\s*', re.S)
              if launch_pat.search(s):
                  s = launch_pat.sub(launch, s)
              else:
                  s = s.replace('</resources>', launch + '</resources>')
              p.write_text(s)
              print('✅ AppTheme.NoActionBar/Launch reescritos (sem ActionBar e sem compat splash)')
          else:
              print('::warning::values/styles.xml não encontrado')

          # --- 2. Zera android:label da MainActivity no AndroidManifest.xml ---
          m = Path('android/app/src/main/AndroidManifest.xml')
          if m.exists():
              t = m.read_text()
              orig = t
              # Normaliza o bloco inteiro da MainActivity: label vazio + tema launch
              # sem duplicar atributos, independentemente da ordem em que vierem.
              def patch_activity(match):
                  tag = match.group(0)
                  tag = re.sub(r'\s+android:label="[^"]*"', '', tag)
                  tag = re.sub(r'\s+android:theme="[^"]*"', '', tag)
                  return tag.replace(
                      'android:name=".MainActivity"',
                      'android:name=".MainActivity"\n            android:label="@string/app_name"\n            android:theme="@style/AppTheme.NoActionBarLaunch"',
                      1,
                  )
              t = re.sub(r'<activity\b[^>]*android:name="\.MainActivity"[^>]*>', patch_activity, t, count=1, flags=re.S)
              if t != orig:
                  m.write_text(t)
                  print('✅ MainActivity label zerado e theme forçado para NoActionBarLaunch')
              else:
                  print('MainActivity label já estava limpo')
          else:
              print('::warning::AndroidManifest.xml não encontrado')
          PY

      - name: Set Android app_name from admin (app-name.txt)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          name = 'Vacatio'
          src = Path('assets/app-name.txt')
          if src.exists():
              raw = src.read_text(encoding='utf-8').strip()
              if raw:
                  name = raw[:30]
          # XML-escape
          esc = (name.replace('&', '&amp;').replace('<', '&lt;')
                     .replace('>', '&gt;').replace('"', '&quot;').replace("'", '&apos;'))
          for rel in ('android/app/src/main/res/values/strings.xml',):
              p = Path(rel)
              if not p.exists():
                  print(f'::warning::{rel} missing'); continue
              s = p.read_text(encoding='utf-8')
              # Substitui app_name e title_activity_main (Capacitor gera ambos)
              def sub_string(txt, key, value):
                  pat = re.compile(rf'(<string\s+name="{key}"[^>]*>)([^<]*)(</string>)')
                  if pat.search(txt):
                      return pat.sub(lambda m: m.group(1) + value + m.group(3), txt)
                  return txt.replace('</resources>', f'    <string name="{key}">{value}</string>\n</resources>')
              s = sub_string(s, 'app_name', esc)
              s = sub_string(s, 'title_activity_main', esc)
              p.write_text(s, encoding='utf-8')
              print(f'✅ app_name/title_activity_main = "{name}" gravados em {rel}')
          PY


      - name: Diagnostic dump — styles.xml + AndroidManifest (post-patch)
        if: always()
        run: |
          echo "===== values/styles.xml ====="
          cat android/app/src/main/res/values/styles.xml 2>/dev/null || echo "(missing)"
          echo ""
          echo "===== values-v31/styles.xml ====="
          cat android/app/src/main/res/values-v31/styles.xml 2>/dev/null || echo "(missing)"
          echo ""
          echo "===== values/colors.xml ====="
          cat android/app/src/main/res/values/colors.xml 2>/dev/null || echo "(missing)"
          echo ""
          echo "===== AndroidManifest.xml (MainActivity + application) ====="
          grep -nE 'application|MainActivity|android:label|android:theme' android/app/src/main/AndroidManifest.xml || true




      - name: Copy google-services.json
        run: |
          mkdir -p android/app
          if [ -f android-config/google-services.json ]; then
            cp android-config/google-services.json android/app/google-services.json
            echo "✅ google-services.json copied to android/app"
          else
            echo "::warning::android-config/google-services.json not found — skipping copy (push notifications won't work)"
          fi

      - name: Validate Google OAuth clients
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          package_name = 'br.com.vacatio.app'
          config_path = Path('android-config/google-services.json')
          cap_path = Path('capacitor.config.ts')
          if not config_path.exists():
              print('::warning::android-config/google-services.json não encontrado. Native Google Sign-In and FCM will be skipped for this build.')
              sys.exit(0)

          data = json.loads(config_path.read_text())
          oauth_clients = []
          for client in data.get('client', []):
              oauth_clients.extend(client.get('oauth_client', []))

          web_ids = [c.get('client_id') for c in oauth_clients if c.get('client_type') == 3 and c.get('client_id')]
          android_clients = [
              c for c in oauth_clients
              if c.get('client_type') == 1 and c.get('android_info', {}).get('package_name') == package_name
          ]

          if not web_ids:
              print('::error::google-services.json não contém OAuth Client ID Web (client_type 3). Crie um cliente Web no Google Cloud/Firebase.')
              sys.exit(1)
          if not android_clients:
              print(f'::error::google-services.json não contém OAuth Client ID Android para package {package_name}. Crie um cliente Android com package e SHA-1 corretos.')
              sys.exit(1)

          fallback_match = re.search(r"GOOGLE_WEB_CLIENT_ID\s*=\s*process\.env\.GOOGLE_WEB_CLIENT_ID\s*\|\|\s*'([^']+)'", cap_path.read_text())
          fallback_web_id = fallback_match.group(1) if fallback_match else ''
          secret_web_id = os.environ.get('GOOGLE_WEB_CLIENT_ID', '').strip()

          if secret_web_id and secret_web_id not in web_ids:
              print('::warning::GOOGLE_WEB_CLIENT_ID do GitHub/Supabase está diferente do OAuth Web do google-services.json; usando o Web Client ID do google-services.json nesta build.')
              print('GOOGLE_WEB_CLIENT_ID efetivo: ***')
          elif fallback_web_id and fallback_web_id not in web_ids:
              print('::warning::Fallback do capacitor.config.ts está diferente do OAuth Web do google-services.json; usando o Web Client ID do google-services.json nesta build.')

          effective_web_id = secret_web_id if secret_web_id in web_ids else fallback_web_id if fallback_web_id in web_ids else web_ids[0]

          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'GOOGLE_WEB_CLIENT_ID_EFFECTIVE={effective_web_id}\n')

          print(f'✅ OAuth Web Client ID validado: {effective_web_id}')
          print(f'✅ OAuth Android Client IDs para {package_name}:')
          for c in android_clients:
              info = c.get('android_info', {})
              print(f"- {c.get('client_id')} | SHA-1 esperado: {info.get('certificate_hash')}")
          PY

      - name: Inject GOOGLE_WEB_CLIENT_ID into capacitor.config.ts
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "${GOOGLE_WEB_CLIENT_ID_EFFECTIVE:-}" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID_EFFECTIVE is empty — falling back to GOOGLE_WEB_CLIENT_ID secret."
          fi
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          cid = os.environ.get('GOOGLE_WEB_CLIENT_ID_EFFECTIVE') or os.environ.get('GOOGLE_WEB_CLIENT_ID', '')
          p = Path('capacitor.config.ts')
          s = p.read_text()
          if cid:
              # Substitui o fallback local pelo Client ID Web configurado no GitHub.
              # Esse mesmo ID precisa alimentar clientId/androidClientId/serverClientId
              # para o idToken nativo vir com o audience aceito pelo Supabase.
              s = re.sub(
                  r"const GOOGLE_WEB_CLIENT_ID = process\.env\.GOOGLE_WEB_CLIENT_ID \|\| '[^']*';",
                  f"const GOOGLE_WEB_CLIENT_ID = '{cid}';",
                  s,
              )
          else:
              print('Keeping capacitor.config.ts Google Web Client ID fallback')
          p.write_text(s)
          print(f'serverClientId injected (len={len(cid)})')
          PY

      - name: Remove stale Android web assets
        run: |
          echo "Removing android/app/src/main/assets/public before Capacitor sync to avoid stale generated bundles"
          rm -rf android/app/src/main/assets/public || true

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Purge precompressed assets from Android bundle (hard safety)
        run: |
          # Última barreira contra "Duplicate resources" no mergeReleaseResources:
          # se qualquer .gz/.br sobrar em android/app/src/main/assets, o Asset
          # Merger vai colidir com o arquivo original. Rodar após cap sync
          # garante limpeza mesmo se algo reintroduzir os arquivos.
          if [ -d android/app/src/main/assets ]; then
            removed=$(find android/app/src/main/assets \( -name '*.gz' -o -name '*.br' \) -type f -print -delete | wc -l)
            echo "Removed $removed precompressed files from android assets"
          fi

      - name: Validate removed native plugins
        run: |
          set -euo pipefail
          pattern='capacitor-background-runner|BackgroundRunner|background-runner'

          # Checa apenas fontes/configurações nativas. Nunca varrer
          # android/app/src/main/assets/public, pois ali ficam bundles web gerados
          # que podem conter strings antigas em chunks versionados.
          native_files=(
            android/settings.gradle
            android/build.gradle
            android/app/build.gradle
            android/app/src/main/AndroidManifest.xml
            package.json
            capacitor.config.ts
          )

          mapfile -t native_source_files < <(
            find android/app/src/main/java android/app/src/main/kotlin \
              -type f 2>/dev/null || true
          )

          if grep -nE "$pattern" "${native_files[@]}" "${native_source_files[@]}" 2>/dev/null; then
            echo "❌ Referência antiga de plugin nativo removido encontrada. Rode uma build limpa com o Android regenerado."
            exit 1
          fi
          echo "✅ Nenhuma referência antiga de plugin nativo removido encontrada."

      - name: Patch MainActivity for edge-to-edge (Android 15+)
        run: |
          # MainActivity robusta:
          #  - EdgeToEdge.enable(this) + WindowCompat.setDecorFitsSystemWindows(false)
          #  - Listener anexado DIRETO na WebView do Capacitor (não em android.R.id.content),
          #    porque em edge-to-edge a WebView recebe/consome os insets primeiro.
          #  - ViewCompat.requestApplyInsets(webView) força o dispatch inicial (em muitos
          #    aparelhos o primeiro inset só chega depois de rotate/foco).
          #  - Guarda os insets e reinjeta o CSS var em onPageFinished pra sobreviver
          #    a recarregamentos de página (deep links, back navigation).
          #  - displayCutoutMode = ALWAYS (substitui SHORT_EDGES deprecado no Android 15).
          PKG_DIR="android/app/src/main/java/br/com/vacatio/app"
          mkdir -p "$PKG_DIR"
          cat > "$PKG_DIR/MainActivity.java" <<'JAVA'
          package br.com.vacatio.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import androidx.activity.EdgeToEdge;
          import androidx.appcompat.app.ActionBar;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              // Últimos insets conhecidos, em px CSS. Reinjetados a cada onPageFinished.
              private int saiTop = 0;
              private int saiRight = 0;
              private int saiBottom = 0;
              private int saiLeft = 0;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  // Tem que vir ANTES do super.onCreate(): se a Activity nasce com
                  // AppTheme.NoActionBarLaunch antigo/compat, o Android pode desenhar
                  // uma ActionBar preta com o label "Vacatio" antes da WebView.
                  setTheme(R.style.AppTheme_NoActionBar);
                  getApplication().setTheme(R.style.AppTheme_NoActionBar);

                  // Antes do super.onCreate por causa do BridgeActivity/ComponentActivity.
                  EdgeToEdge.enable(this);
                  super.onCreate(savedInstanceState);

                  // Captura de tela (screenshot / gravação) liberada para todos os
                  // usuários — FLAG_SECURE removido intencionalmente.


                  try {
                      ActionBar actionBar = getSupportActionBar();
                      if (actionBar != null) actionBar.hide();
                  } catch (Throwable ignored) {}

                  // Reforço explícito: garantir que o decor não come os insets.
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

                  // Cutout ALWAYS (Android 11+); substitui SHORT_EDGES deprecado no 15.
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                  }

                  final WebView webView;
                  try {
                      webView = (WebView) getBridge().getWebView();
                  } catch (Throwable t) {
                      return;
                  }
                  if (webView == null) return;

                  final float density = getResources().getDisplayMetrics().density;

                  // Listener direto na WebView — é ela que efetivamente recebe os insets
                  // em edge-to-edge no Capacitor.
                  ViewCompat.setOnApplyWindowInsetsListener(webView, (v, insets) -> {
                      Insets bars = insets.getInsets(
                          WindowInsetsCompat.Type.systemBars()
                              | WindowInsetsCompat.Type.displayCutout()
                      );
                      saiTop = (int) (bars.top / density);
                      saiRight = (int) (bars.right / density);
                      saiBottom = (int) (bars.bottom / density);
                      saiLeft = (int) (bars.left / density);
                      injectSafeAreaCss(webView);
                      // Não consumir — deixa filhos verem os insets se precisarem.
                      return insets;
                  });

                  // Fallback: se por algum motivo o listener não disparar na WebView,
                  // tentar também no content view.
                  final View content = findViewById(android.R.id.content);
                  if (content != null) {
                      ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                          Insets bars = insets.getInsets(
                              WindowInsetsCompat.Type.systemBars()
                                  | WindowInsetsCompat.Type.displayCutout()
                          );
                          if (saiTop == 0 && bars.top > 0) {
                              saiTop = (int) (bars.top / density);
                              saiRight = (int) (bars.right / density);
                              saiBottom = (int) (bars.bottom / density);
                              saiLeft = (int) (bars.left / density);
                              injectSafeAreaCss(webView);
                          }
                          return insets;
                      });
                  }

                  // Força o primeiro dispatch de insets — sem isso, muitos aparelhos
                  // só entregam o inset após rotate/foco.
                  ViewCompat.requestApplyInsets(webView);

                  // Belt-and-suspenders: NÃO substituímos o WebViewClient do Capacitor
                  // (isso quebra a bridge). Em vez disso, reinjetamos o CSS var em
                  // intervalos crescentes após o boot — como o JS é idempotente
                  // (só seta CSS vars), isso é seguro e cobre o caso de SPA reload
                  // ou insets que chegam depois do primeiro paint.
                  final Handler h = new Handler(Looper.getMainLooper());
                  int[] delaysMs = new int[] { 150, 500, 1200, 2500, 5000 };
                  for (int d : delaysMs) {
                      h.postDelayed(() -> injectSafeAreaCss(webView), d);
                  }
              }

              private void injectSafeAreaCss(WebView wv) {
                  if (wv == null) return;
                  try {
                      String js = String.format(
                          "(function(){var d=document.documentElement;" +
                          "if(!d)return;" +
                          "var v=[%d,%d,%d,%d];" +
                          "['--sai-top','--sai-right','--sai-bottom','--sai-left']" +
                          ".forEach(function(k,i){d.style.setProperty(k,v[i]+'px');});" +
                          "})();",
                          saiTop, saiRight, saiBottom, saiLeft);
                      wv.evaluateJavascript(js, null);
                  } catch (Throwable ignored) {}
              }

          }
          JAVA
          echo "✅ MainActivity com edge-to-edge robusta escrita"

      - name: Add tools namespace + override ML Kit orientation + resizeable app
        run: |
          # Recomendação Play #3: remover screenOrientation=portrait forçado pela
          # activity interna do ML Kit code-scanner + declarar resizeableActivity
          # para dispositivos de tela grande (Android 16 ignora restrições).
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          # 1) namespace xmlns:tools
          if 'xmlns:tools=' not in s:
              s = s.replace(
                  '<manifest ',
                  '<manifest xmlns:tools="http://schemas.android.com/tools" ',
                  1,
              )
              print('xmlns:tools adicionado')

          # 2) resizeableActivity="true" na <application>
          if 'android:resizeableActivity' not in s:
              s = re.sub(
                  r'<application\b',
                  '<application android:resizeableActivity="true"',
                  s,
                  count=1,
              )
              print('resizeableActivity=true adicionado à <application>')

          # 3) <supports-screens> — declara oficialmente suporte a tablets
          # para o "Tablet-optimized" badge da Play Store.
          if '<supports-screens' not in s:
              supports = (
                  '    <supports-screens\n'
                  '        android:resizeable="true"\n'
                  '        android:smallScreens="true"\n'
                  '        android:normalScreens="true"\n'
                  '        android:largeScreens="true"\n'
                  '        android:xlargeScreens="true"\n'
                  '        android:anyDensity="true"\n'
                  '        android:requiresSmallestWidthDp="320" />\n'
                  '    <application'
              )
              s = s.replace('    <application', supports, 1)
              print('<supports-screens> adicionado (tablet-optimized ready)')

          # 4) override da activity do ML Kit code-scanner
          if 'GmsBarcodeScanningDelegateActivity' not in s:
              override = (
                  '        <activity\n'
                  '            android:name="com.google.mlkit.vision.codescanner.internal.GmsBarcodeScanningDelegateActivity"\n'
                  '            android:screenOrientation="unspecified"\n'
                  '            android:resizeableActivity="true"\n'
                  '            tools:replace="android:screenOrientation" />\n'
                  '    </application>'
              )
              s = s.replace('</application>', override, 1)
              print('override ML Kit orientation aplicado')

          # 5) configChanges + resizeableActivity + supportsPictureInPicture
          #    na MainActivity — evita recreate em rotação/multi-window/foldable.
          if 'android:name=".MainActivity"' in s and 'android:configChanges' not in s:
              s = re.sub(
                  r'(<activity\s+android:name="\.MainActivity")',
                  r'\1\n            android:resizeableActivity="true"'
                  r'\n            android:supportsPictureInPicture="false"'
                  r'\n            android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|uiMode|density|navigation|touchscreen|fontScale|locale|layoutDirection"',
                  s,
                  count=1,
              )
              print('configChanges/resizeable aplicados à MainActivity')

          p.write_text(s)
          PY



      - name: Add <queries> for external apps (Android 11+ package visibility)
        run: |
          # Android 11+ (API 30) exige declarar quais pacotes o app pode inspecionar
          # via PackageManager.queryIntentActivities. Sem isso, @capacitor/app-launcher
          # (usado nos deep links de mapas) retorna sempre "não instalado" para
          # Uber/Waze/99/Google Maps, e o app cai no fallback web.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if '<queries>' in s:
              print('queries block already present — skipping')
          else:
              queries = '''    <queries>
                  <!-- Navegação / mapas -->
                  <package android:name="com.google.android.apps.maps" />
                  <package android:name="com.waze" />
                  <package android:name="com.ubercab" />
                  <package android:name="com.taxis99" />
                  <!-- Browsers para openExternal / InAppBrowser fallback -->
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" />
                  </intent>
                  <!-- Compartilhamento por texto -->
                  <intent>
                      <action android:name="android.intent.action.SEND" />
                      <data android:mimeType="text/plain" />
                  </intent>
                  <!-- Ligar / tel: -->
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                      <data android:scheme="tel" />
                  </intent>
                  <!-- E-mail -->
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                      <data android:scheme="mailto" />
                  </intent>
              </queries>
          '''
              s = s.replace('<application', queries + '<application', 1)
              p.write_text(s)
              print('✅ <queries> block added to AndroidManifest')
          PY


