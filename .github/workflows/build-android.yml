      - name: Baseline Profile + ProfileInstaller (Android cold start speedup)
        run: |
          # Baseline Profiles pré-compilam (AOT) as classes/métodos listados
          # aqui na instalação do app, cortando 20-40% do tempo de cold start
          # e reduzindo jank nas primeiras interações. Ref:
          # https://developer.android.com/topic/performance/baselineprofiles/overview
          # Estratégia: escrever uma baseline manual em src/main/baseline-prof.txt
          # com os pontos quentes do bootstrap (Capacitor bridge, WebView, plugins
          # nativos usados no boot). AGP 8.13 já a empacota automaticamente
          # em bundleRelease quando o arquivo existe.
          set -euo pipefail

          mkdir -p android/app/src/main
          cat > android/app/src/main/baseline-prof.txt <<'PROFILE'
          # ---- Capacitor bridge / WebView bootstrap ----
          HSPLcom/getcapacitor/BridgeActivity;->onCreate(Landroid/os/Bundle;)V
          HSPLcom/getcapacitor/BridgeActivity;->onStart()V
          HSPLcom/getcapacitor/BridgeActivity;->onResume()V
          HSPLcom/getcapacitor/Bridge;->loadWebView()V
          HSPLcom/getcapacitor/Bridge;->initWebView()V
          HSPLcom/getcapacitor/PluginManager;->loadPluginsFromManifest()V
          HSPLbr/com/vacatio/app/MainActivity;->onCreate(Landroid/os/Bundle;)V
          # ---- AndroidX / activity bootstrap ----
          HSPLandroidx/activity/ComponentActivity;->onCreate(Landroid/os/Bundle;)V
          HSPLandroidx/core/view/WindowInsetsCompat;->getInsets(I)Landroidx/core/graphics/Insets;
          HSPLandroidx/profileinstaller/ProfileInstaller;->writeProfile(Landroid/content/Context;)V
          # ---- WebView + WebViewClient ----
          HSPLandroid/webkit/WebView;-><init>(Landroid/content/Context;)V
          HSPLandroid/webkit/WebViewClient;->onPageFinished(Landroid/webkit/WebView;Ljava/lang/String;)V
          HSPLandroid/webkit/WebSettings;->setJavaScriptEnabled(Z)V
          PROFILE

          # Sanitização estrita: o AGP falha em `expandReleaseArtProfileWildcards`
          # se qualquer regra de classe tiver flags [HSP] OU se houver wildcards
          # em regras de classe (Lcom/foo/**;) que expandem para linhas inválidas
          # quando mescladas com perfis de AARs de terceiros. Regras aceitas:
          #   - Regra de método: [HSP]*L<class>;-><method>(<sig>)<ret>
          #   - Regra de classe exata: L<class>;  (sem flags, sem '*')
          # Qualquer outra coisa é descartada.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/baseline-prof.txt')
          method_re = re.compile(r'^[HSP]*L[^;]+;->.+$')
          class_re = re.compile(r'^L[^;*]+;$')
          out = []
          dropped = 0
          for raw in p.read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              if '->' in line:
                  if method_re.match(line) and '*' not in line.split('->')[0]:
                      out.append(line)
                  else:
                      dropped += 1
                  continue
              # regra de classe: remove flags iniciais
              i = 0
              while i < len(line) and line[i] in 'HSP':
                  i += 1
              if i > 0 and i < len(line) and line[i] == 'L':
                  line = line[i:]
              if class_re.match(line):
                  out.append(line)
              else:
                  dropped += 1
          p.write_text('\n'.join(out) + '\n')
          print(f'✅ baseline-prof.txt sanitizado ({len(out)} regras, {dropped} descartadas)')
          PY
          echo "✅ baseline-prof.txt gravado ($(wc -l < android/app/src/main/baseline-prof.txt) linhas)"

          # ProfileInstaller runtime: aplica o perfil já pré-instalado nas
          # primeiras execuções (backport para dispositivos <Android 9).
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          dep = "    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'"
          if 'androidx.profileinstaller:profileinstaller' in s:
              print('profileinstaller já presente')
          else:
              new, n = re.subn(
                  r'(dependencies\s*\{\s*\n)',
                  r'\1' + dep + '\n',
                  s,
                  count=1,
              )
              if n == 0:
                  new = s.rstrip() + '\n\ndependencies {\n' + dep + '\n}\n'
              p.write_text(new)
              print('✅ profileinstaller:1.4.1 adicionado a app/build.gradle')
          PY

      - name: Enable resource shrinking + AAB splits (delivery size optimization)
        run: |
          # Play Feature Delivery / Asset Packs não se aplicam bem ao
          # laws-bundle: ele é servido pela WebView do Capacitor a partir de
          # android/app/src/main/assets/public/ (via `cap sync`). Asset Packs
          # ficam num AssetPackManager separado, o que exigiria reescrever o
          # carregador do WebView. Alternativa equivalente em ganho de
          # tamanho de download:
          #   • shrinkResources true  → R8 remove drawables/strings não usadas
          #   • bundle language/density/abi splits → Play entrega só a variante
          #     do dispositivo do usuário (~30% menor por instalação).
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()

          if 'shrinkResources true' not in s:
              s2, n = re.subn(
                  r'(release\s*\{[^}]*?minifyEnabled\s+true)',
                  r"\1\n            shrinkResources true",
                  s,
                  count=1,
                  flags=re.DOTALL,
              )
              if n:
                  s = s2
                  print('✅ shrinkResources true adicionado ao buildType release')
              else:
                  print('::warning::release{} com minifyEnabled não encontrado — shrinkResources pulado')
          else:
              print('shrinkResources já presente')

          if 'enableSplit' not in s:
              bundle_block = (
                  "\n    bundle {\n"
                  "        language { enableSplit = true }\n"
                  "        density  { enableSplit = true }\n"
                  "        abi      { enableSplit = true }\n"
                  "    }\n"
              )
              idx = s.find('android {')
              if idx >= 0:
                  depth = 0
                  end = idx
                  for i, ch in enumerate(s[idx:], start=idx):
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i
                              break
                  s = s[:end] + bundle_block + s[end:]
                  print('✅ bundle {} splits adicionado dentro de android {}')
              else:
                  print('::warning::bloco android {} não encontrado — bundle splits pulado')
          else:
              print('bundle splits já presente')

          p.write_text(s)
          PY

      - name: In-App Updates (Google Play Core app-update)
        run: |
          # Play In-App Updates: mostra prompt nativo quando há uma versão
          # nova no Play Store, sem forçar o usuário a abrir a loja.
          # Ref: https://developer.android.com/guide/playcore/in-app-updates
          # Usamos FLEXIBLE (download em background + snackbar pra reiniciar),
          # não IMMEDIATE — não bloqueia o app enquanto baixa.
          set -euo pipefail

          # 1) Dependência
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          dep = "    implementation 'com.google.android.play:app-update:2.1.0'"
          if 'com.google.android.play:app-update' in s:
              print('app-update já presente')
          else:
              s, n = re.subn(r'(dependencies\s*\{\s*\n)', r'\1' + dep + '\n', s, count=1)
              if n == 0:
                  s = s.rstrip() + '\n\ndependencies {\n' + dep + '\n}\n'
              p.write_text(s)
              print('✅ app-update:2.1.0 adicionado')
          PY

          # 2) Helper Java isolado
          PKG_DIR="android/app/src/main/java/br/com/vacatio/app"
          mkdir -p "$PKG_DIR"
          cat > "$PKG_DIR/InAppUpdateHelper.java" <<'JAVA'
          package br.com.vacatio.app;

          import android.app.Activity;
          import android.util.Log;
          import com.google.android.play.core.appupdate.AppUpdateInfo;
          import com.google.android.play.core.appupdate.AppUpdateManager;
          import com.google.android.play.core.appupdate.AppUpdateManagerFactory;
          import com.google.android.play.core.appupdate.AppUpdateOptions;
          import com.google.android.play.core.install.InstallStateUpdatedListener;
          import com.google.android.play.core.install.model.AppUpdateType;
          import com.google.android.play.core.install.model.InstallStatus;
          import com.google.android.play.core.install.model.UpdateAvailability;

          /**
           * FLEXIBLE In-App Update: baixa em background e, ao terminar, chama
           * completeUpdate(). O prompt nativo do Play cuida de reiniciar o app.
           * Falhas são silenciosas (Play Services ausente, sem update, etc.).
           */
          public class InAppUpdateHelper {
              private static final String TAG = "InAppUpdate";
              private static final int REQ_CODE = 4711;

              public static void check(final Activity activity) {
                  try {
                      final AppUpdateManager manager =
                          AppUpdateManagerFactory.create(activity.getApplicationContext());

                      InstallStateUpdatedListener listener = state -> {
                          if (state.installStatus() == InstallStatus.DOWNLOADED) {
                              manager.completeUpdate();
                          }
                      };
                      manager.registerListener(listener);

                      manager.getAppUpdateInfo().addOnSuccessListener((AppUpdateInfo info) -> {
                          try {
                              if (info.updateAvailability()
                                      == UpdateAvailability.UPDATE_AVAILABLE
                                  && info.isUpdateTypeAllowed(AppUpdateType.FLEXIBLE)) {
                                  manager.startUpdateFlowForResult(
                                      info,
                                      activity,
                                      AppUpdateOptions.newBuilder(AppUpdateType.FLEXIBLE).build(),
                                      REQ_CODE);
                              }
                          } catch (Throwable t) {
                              Log.w(TAG, "startUpdateFlow failed", t);
                          }
                      });
                  } catch (Throwable t) {
                      Log.w(TAG, "In-app update check failed (safe to ignore)", t);
                  }
              }
          }
          JAVA
          echo "✅ InAppUpdateHelper.java escrito"

          # 3) Chamada no onCreate da MainActivity (append via python patch)
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/br/com/vacatio/app/MainActivity.java')
          s = p.read_text()
          if 'InAppUpdateHelper.check' in s:
              print('MainActivity já chama InAppUpdateHelper')
          else:
              # Inserir depois do super.onCreate(savedInstanceState);
              needle = 'super.onCreate(savedInstanceState);'
              add = '\n                  // Fase 4: checa se há update no Play Store (FLEXIBLE)\n                  try { InAppUpdateHelper.check(this); } catch (Throwable ignored) {}\n'
              if needle in s:
                  s = s.replace(needle, needle + add, 1)
                  p.write_text(s)
                  print('✅ InAppUpdateHelper.check(this) injetado no onCreate')
              else:
                  print('::warning::super.onCreate não encontrado — pulando injeção')
          PY

      - name: Accessibility polish (Android manifest a11y attrs)
        run: |
          # A11y checklist do developer.android.com aplicado ao manifest:
          #  - supportsRtl=true (habilita layout mirroring para leitores RTL)
          #  - android:label na application/activity (TalkBack anuncia o app)
          #  - accessibilityDataSensitive não-crítico aqui (é pra views nativas)
          # A WebView do Capacitor já expõe roles ARIA da UI React ao TalkBack
          # automaticamente quando accessibilityEnabled=true no sistema.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          changed = False
          if 'android:supportsRtl=' not in s:
              s = re.sub(r'<application\b', '<application android:supportsRtl="true"', s, count=1)
              changed = True
              print('✅ supportsRtl=true adicionado')
          if changed:
              p.write_text(s)
          else:
              print('a11y attrs já presentes')
          PY


      - name: Final guard — remove native title bar before build
        run: |
          # Última barreira antes do Gradle: alguns steps acima mexem no
          # Manifest depois do diagnóstico inicial. Normaliza de novo e falha
          # a build se a compat splash/ActionBar voltar.
          python3 - <<'PY'
          from pathlib import Path
          import re

          styles = {
              Path('android/app/src/main/res/values/styles.xml'): '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowBackground">@color/app_bg</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowBackground">@color/app_bg</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@color/splash_bg</item>
                  <item name="android:windowBackground">@color/splash_bg</item>
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          ''',
              Path('android/app/src/main/res/values-v31/styles.xml'): '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@color/splash_bg</item>
                  <item name="android:windowBackground">@color/splash_bg</item>
                  <item name="android:windowSplashScreenBackground">@color/splash_bg</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">@color/splash_bg</item>
                  <item name="android:windowSplashScreenBrandingImage">@null</item>
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
              </style>
          </resources>
          ''',
              Path('android/app/src/main/res/values-night-v31/styles.xml'): '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@color/splash_bg</item>
                  <item name="android:windowBackground">@color/splash_bg</item>
                  <item name="android:windowSplashScreenBackground">@color/splash_bg</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">@color/splash_bg</item>
                  <item name="android:windowSplashScreenBrandingImage">@null</item>
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
              </style>
          </resources>
          ''',
          }
          for path, content in styles.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          def patch_activity(match):
              tag = match.group(0)
              tag = re.sub(r'\s+android:label="[^"]*"', '', tag)
              tag = re.sub(r'\s+android:theme="[^"]*"', '', tag)
              return tag.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity"\n            android:label="@string/app_name"\n            android:theme="@style/AppTheme.NoActionBarLaunch"',
                  1,
              )
          s2 = re.sub(r'<activity\b[^>]*android:name="\.MainActivity"[^>]*>', patch_activity, s, count=1, flags=re.S)
          manifest.write_text(s2)
          PY

          echo "===== FINAL styles.xml ====="
          cat android/app/src/main/res/values/styles.xml
          echo "===== FINAL values-v31/styles.xml ====="
          cat android/app/src/main/res/values-v31/styles.xml
          echo "===== FINAL MainActivity manifest ====="
          grep -nA18 -B2 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml || true
          if grep -R "Theme.SplashScreen" android/app/src/main/res/values android/app/src/main/res/values-v31 android/app/src/main/res/values-night-v31; then
            echo "::error::Theme.SplashScreen compat voltou; isso pode recriar a faixa preta."
            exit 1
          fi
          if ! grep -nA12 -B2 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml | grep -q 'android:label="@string/app_name"'; then
            echo "::error::MainActivity precisa ter android:label=\"@string/app_name\" para o launcher exibir o nome."
            exit 1
          fi
          echo "✅ Guard final OK: sem Theme.SplashScreen compat e MainActivity com label @string/app_name"




      - name: Build .aab (bundleRelease)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build .apk (assembleRelease)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename outputs with version (app-vacatio-<versionName>)
        run: |
          set -euo pipefail
          BASE="${ARTIFACT_BASENAME:-app-vacatio-release}"
          AAB_SRC="android/app/build/outputs/bundle/release/app-release.aab"
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          AAB_DST="android/app/build/outputs/bundle/release/${BASE}.aab"
          APK_DST="android/app/build/outputs/apk/release/${BASE}.apk"
          cp "$AAB_SRC" "$AAB_DST"
          cp "$APK_SRC" "$APK_DST"
          echo "AAB_PATH=$AAB_DST" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK_DST" >> "$GITHUB_ENV"
          echo "✅ Renomeado para: ${BASE}.aab / ${BASE}.apk"

      - name: Create download-safe TXT copies
        run: |
          set -euo pipefail
          BASE="${ARTIFACT_BASENAME:-app-vacatio-release}"
          mkdir -p android-download-safe
          base64 -w 0 "$AAB_PATH" > "android-download-safe/${BASE}.aab.base64.txt"
          base64 -w 0 "$APK_PATH" > "android-download-safe/${BASE}.apk.base64.txt"
          cat > android-download-safe/COMO-RESTAURAR-ANDROID.txt <<TXT
          Estes arquivos TXT contêm o AAB e o APK codificados em Base64 para evitar bloqueio falso positivo do navegador/antivírus durante o download.

          Para restaurar no Windows PowerShell:

          certutil -decode ${BASE}.aab.base64.txt ${BASE}.aab
          certutil -decode ${BASE}.apk.base64.txt ${BASE}.apk

          Depois disso:
          - ${BASE}.aab: envie para a Google Play Console
          - ${BASE}.apk: use apenas para teste/instalação manual
          TXT

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Upload download-safe TXT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}-android-base64-txt
          path: android-download-safe/*.txt
          if-no-files-found: error

      - name: Upload mapping.txt (R8 deobfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn


      - name: Locate native debug symbols
        id: locate_symbols
        if: always()
        run: |
          set -e
          mkdir -p android/app/build/outputs/native-debug-symbols-collected
          # AGP pode gerar em caminhos diferentes conforme a variante e a versão.
          # Coletamos qualquer .zip de símbolos nativos encontrado no build.
          found=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "→ encontrado: $f"
            cp "$f" android/app/build/outputs/native-debug-symbols-collected/
            found=1
          done < <(find android/app/build -type f \( -name 'native-debug-symbols*.zip' -o -name 'symbols.zip' \) 2>/dev/null)
          if [ "$found" = "0" ]; then
            echo "::warning::Nenhum arquivo de símbolos nativos foi gerado por este build. Isso é normal se o app não tem código nativo próprio (só libs pré-compiladas do Capacitor já vêm com símbolos strip pelo fornecedor). O aviso do Play Console pode ser ignorado."
          fi

      - name: Upload native debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacatio-release-native-symbols
          path: android/app/build/outputs/native-debug-symbols-collected/*.zip
          if-no-files-found: ignore


      - name: Persist version bump (commit .build-version.json)
        if: success()
        # Só commita se a build passou até aqui. Assim, se a build falhar,
        # o buildNumber não avança e a próxima tentativa reusa o mesmo.
        run: |
          set -e
          if git diff --quiet .build-version.json; then
            echo "Nada mudou em .build-version.json — nada a commitar."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .build-version.json
          git commit -m "chore(release): bump para v${APP_VERSION_NAME} (build #${APP_BUILD_NUMBER}, versionCode ${APP_VERSION_CODE}) [skip ci]"
          # Rebase-safe: se outra build rodou em paralelo, puxa antes de empurrar.
          for i in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF#refs/heads/}; then
              echo "✅ .build-version.json commitado."
              exit 0
            fi
            echo "Push falhou (tentativa $i) — rebase e retry."
            git pull --rebase origin ${GITHUB_REF#refs/heads/} || true
          done
          echo "::warning::Não foi possível commitar o bump de versão. Próxima build pode reusar buildNumber (versionCode ainda cresce via timestamp)."
