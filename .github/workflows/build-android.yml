      - name: Backup & Data Extraction Rules (Android 12+ privacy hardening)
        run: |
          mkdir -p android/app/src/main/res/xml
          # data_extraction_rules.xml — Android 12+ (targetSdk 31+):
          # controla o que sai via Cloud Backup e Device-to-Device transfer.
          # Bloqueia tudo que carrega tokens Supabase, secure-storage biométrico
          # e caches de OCR. Google Play Data Safety exige declaração explícita.
          cat > android/app/src/main/res/xml/data_extraction_rules.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
            <cloud-backup>
              <exclude domain="sharedpref" path="CapacitorStorage.xml" />
              <exclude domain="sharedpref" path="capacitor-secure-storage.xml" />
              <exclude domain="sharedpref" path="io.supabase.gotrue.xml" />
              <exclude domain="sharedpref" path="FirebaseAppHeartBeat.xml" />
              <exclude domain="database" path="capacitor.db" />
              <exclude domain="file" path="Cookies" />
              <exclude domain="file" path="Cookies-journal" />
              <exclude domain="file" path="cache" />
            </cloud-backup>
            <device-transfer>
              <exclude domain="sharedpref" path="CapacitorStorage.xml" />
              <exclude domain="sharedpref" path="capacitor-secure-storage.xml" />
              <exclude domain="sharedpref" path="io.supabase.gotrue.xml" />
              <exclude domain="database" path="capacitor.db" />
              <exclude domain="file" path="Cookies" />
              <exclude domain="file" path="Cookies-journal" />
              <exclude domain="file" path="cache" />
            </device-transfer>
          </data-extraction-rules>
          XML
          # backup_rules.xml — Android 11 (targetSdk 30) fallback usado quando
          # o dispositivo ainda não interpreta data_extraction_rules.
          cat > android/app/src/main/res/xml/backup_rules.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
            <exclude domain="sharedpref" path="CapacitorStorage.xml" />
            <exclude domain="sharedpref" path="capacitor-secure-storage.xml" />
            <exclude domain="sharedpref" path="io.supabase.gotrue.xml" />
            <exclude domain="sharedpref" path="FirebaseAppHeartBeat.xml" />
            <exclude domain="database" path="capacitor.db" />
            <exclude domain="file" path="Cookies" />
            <exclude domain="file" path="Cookies-journal" />
            <exclude domain="file" path="cache" />
          </full-backup-content>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          # Adiciona/atualiza android:allowBackup="true" + regras explícitas.
          # Mantemos backup=true (users querem migrar de aparelho), mas
          # excluímos tudo que é sensível via data_extraction_rules.xml.
          def upsert(attr, value):
              global s
              pattern = rf'android:{attr}="[^"]*"'
              new = f'android:{attr}="{value}"'
              if re.search(pattern, s):
                  s = re.sub(pattern, new, s, count=1)
              else:
                  s = s.replace('<application', f'<application\n        {new}', 1)
          upsert('allowBackup', 'true')
          upsert('fullBackupContent', '@xml/backup_rules')
          upsert('dataExtractionRules', '@xml/data_extraction_rules')
          # tools:replace pra sobrescrever manifest merger de plugins.
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          # Adiciona/atualiza tools:replace SOMENTE na tag <application>.
          # Não olhar globalmente: `<activity>` do ML Kit também usa tools:replace
          # (para screenOrientation) e não pode ser sobrescrito aqui.
          m = re.search(r'<application\b[^>]*?tools:replace="([^"]*)"', s)
          desired = {'android:allowBackup', 'android:fullBackupContent', 'android:dataExtractionRules'}
          if m:
              current = {x.strip() for x in m.group(1).split(',') if x.strip()}
              merged = ','.join(sorted(current | desired))
              s = s[:m.start(1)] + merged + s[m.end(1):]
          else:
              s = s.replace(
                  'android:dataExtractionRules="@xml/data_extraction_rules"',
                  'android:dataExtractionRules="@xml/data_extraction_rules"\n        tools:replace="android:allowBackup,android:dataExtractionRules,android:fullBackupContent"',
                  1,
              )
          p.write_text(s)
          print('✅ AndroidManifest: allowBackup=true + backup_rules + data_extraction_rules aplicados')
          PY

      - name: Predictive Back + LocaleConfig (Android 13/14/15 polish)
        run: |
          mkdir -p android/app/src/main/res/xml
          # locales_config.xml — Android 13+ (Per-App Language Preferences).
          # Google exige a declaração mesmo com um único idioma; sem isso, a Play
          # Console emite warning "Missing localeConfig".
          cat > android/app/src/main/res/xml/locales_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <locale-config xmlns:android="http://schemas.android.com/apk/res/android">
            <locale android:name="pt-BR" />
          </locale-config>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          def upsert(attr, value):
              global s
              pattern = rf'android:{attr}="[^"]*"'
              new = f'android:{attr}="{value}"'
              if re.search(pattern, s):
                  s = re.sub(pattern, new, s, count=1)
              else:
                  s = s.replace('<application', f'<application\n        {new}', 1)
          # Predictive Back Gesture (Android 14+ opt-in / 15+ default).
          # Sem isso, a animação nativa de "voltar" fica travada.
          upsert('enableOnBackInvokedCallback', 'true')
          # Per-App Language (Android 13+).
          upsert('localeConfig', '@xml/locales_config')
          # Amplia tools:replace SOMENTE na tag <application> (não no <activity> do ML Kit).
          m = re.search(r'(<application\b[^>]*?tools:replace=")([^"]*)(")', s)
          extra = {'android:allowBackup', 'android:fullBackupContent', 'android:dataExtractionRules',
                   'android:enableOnBackInvokedCallback', 'android:localeConfig'}
          if m:
              current = {x.strip() for x in m.group(2).split(',') if x.strip()}
              merged = ','.join(sorted(current | extra))
              s = s[:m.start(2)] + merged + s[m.end(2):]
          else:
              # Sem tools:replace na <application> — insere um novo.
              s = re.sub(
                  r'(<application\b)',
                  r'\1 tools:replace="' + ','.join(sorted(extra)) + '"',
                  s,
                  count=1,
              )
          p.write_text(s)
          print('✅ enableOnBackInvokedCallback=true + localeConfig aplicados')
          PY

