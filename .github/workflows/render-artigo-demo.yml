name: Render Artigo Demo (Remotion)

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: remotion
        run: npm install

      - name: Install Chrome dependencies (for Puppeteer/Remotion)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libasound2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 fonts-noto-color-emoji

      - name: Render Video
        working-directory: remotion
        run: npx remotion render artigo-demo out.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artigo-demo-video
          path: remotion/out.mp4
          retention-days: 7
