name: Render Boletim Jurídico (MP4)

on:
  workflow_dispatch:
    inputs:
      boletim_id:
        description: 'ID do boletim em boletins_juridicos'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (remotion-boletim)
        working-directory: remotion-boletim
        run: |
          npm install --no-audit --no-fund
          npm install @supabase/supabase-js@2.100.0

      - name: Install Chrome deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libasound2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 fonts-noto-color-emoji

      - name: Render MP4
        working-directory: remotion-boletim
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOLETIM_ID: ${{ inputs.boletim_id }}
        run: node scripts/render.mjs

      - name: Upload para YouTube
        if: success()
        run: |
          curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/boletim-youtube-upload" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"boletim_id\":\"${{ inputs.boletim_id }}\"}"